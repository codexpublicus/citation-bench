name: Homelab runner setup
description: >-
  Checks for what the jobs need from the homelab runner image, then installs the mise
  tools. uv builds sdists for some of the eyecite adapter's pinned dependencies
  (pyahocorasick 2.0.0, regex 2023.12.25) because they have no cp313 wheels, so the
  jobs need a C toolchain. The image has build-essential (lokkju/infra#81) but no
  passwordless sudo (lokkju/infra#105), so this only tries `sudo -n apt-get` if the
  toolchain is missing and fails if it can't.

runs:
  using: composite
  steps:
    - name: Check the C toolchain
      shell: bash
      run: |
        set -euo pipefail

        # build-essential from dpkg, or a compiler pair and make on PATH
        if dpkg-query -W -f='${Status}' build-essential 2>/dev/null | grep -q 'install ok installed' \
          || { command -v cc && command -v c++ && command -v make; } >/dev/null; then
          echo "cc and c++ are already installed"
          exit 0
        fi
        missing=(build-essential)

        if [[ "$(id -u)" == 0 ]]; then
          sudo=()
        elif sudo -n true 2>/dev/null; then
          sudo=(sudo -n)
        else
          echo "::error::the runner image lacks ${missing[*]} and has no passwordless sudo to install them (lokkju/infra#105); add them to homelab/images/garm-runner/Dockerfile in lokkju/infra"
          exit 1
        fi
        echo "installing ${missing[*]}"
        "${sudo[@]}" env DEBIAN_FRONTEND=noninteractive apt-get update -q
        "${sudo[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends "${missing[@]}"

    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
