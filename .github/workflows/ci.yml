name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # No job here builds citare.
  MISE_DISABLE_TOOLS: rust
  # eyecite's output depends on the string hash seed; the adapter pins it as well.
  PYTHONHASHSEED: "0"

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mise run check

  # eyecite against its own vectors has to score 100%; anything less is a bug in the
  # exporter, the adapter or the scorer, not in eyecite.
  eyecite:
    name: eyecite vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mise run bench:eyecite
      # Per-kind statute metrics (bench/statutes.py) for eyecite, in the job summary.
      # citare's CI reports its own beside these; nothing here gates.
      - name: Statute metrics
        run: |
          mise run report:statutes eyecite
          cat reports/statutes/report.md >> "$GITHUB_STEP_SUMMARY"

  # The stored eyecite runs in baselines/eyecite/ (bench/baseline.py) have to match
  # their keys, or engines' CI falls back to running eyecite live. This job only checks
  # the keys. A stale tier is rerun by the eyecite baselines workflow
  # (eyecite-baseline.yml), which runs on the self-hosted runner class the stored runs
  # are timed on, and only on a push to main or a maintainer's dispatch.
  baseline:
    name: Stored eyecite runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Check the keys
        id: stale
        run: |
          uv run -q bench/baseline.py check | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "tiers=$(uv run -q bench/baseline.py stale | xargs)" >> "$GITHUB_OUTPUT"

      - name: Fail until the new runs are committed
        if: steps.stale.outputs.tiers != ''
        env:
          TIERS: ${{ steps.stale.outputs.tiers }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          msg="Stored eyecite runs are stale ($TIERS). A maintainer reruns them with: gh workflow run eyecite-baseline.yml --ref $REF, then commits the eyecite-baseline artifact that run uploads into baselines/eyecite/."
          echo "::error title=Stale eyecite runs::$msg"
          { echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          exit 1
