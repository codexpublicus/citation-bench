[package]
name = "citare-bench-adapter"
version = "0.1.0"
edition = "2021"
publish = false
description = "citation-bench adapter for citare"

# Track citare main; Cargo.lock pins the exact commit. To bench a local checkout:
#   cargo run --release --config 'patch."https://github.com/codexpublicus/citare".citare-core.path="../citare/crates/citare-core"'
[dependencies]
citare-core = { git = "https://github.com/codexpublicus/citare", branch = "main" }
serde_json = "1"

[workspace]
