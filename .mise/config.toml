#MISE description="citation-bench: engine-neutral legal citation benchmark"

[tools]
python = "3.13"
uv = "0.9.21"
rust = "stable"

[settings.age]
identity_files = ["~/.config/mise/age.lokkju.txt"]
# CI has no identity: skip values it can't decrypt instead of failing the env.
strict = false

[env]
# age-encrypted for the operator's identity; read by the statute verifier
COURTLISTENER_API_TOKEN = { age = "" }
NY_OPENLEG_API_KEY = { age = "" }
# eyecite's output depends on the string hash seed (adapters/eyecite/adapter.py pins it
# too, and restarts under it otherwise), so stored runs reproduce on rerun.
PYTHONHASHSEED = "0"
# One build dir for every adapter, so tasks run the binary they just built.
CARGO_TARGET_DIR = "{{config_root}}/target"
